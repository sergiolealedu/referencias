name: Release Android

on:
  # Compartilha o grupo de concorrência "production-deploy" com o deploy do
  # servidor: numa mesma tag os dois entram na fila em vez de rodar em paralelo.
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

# Grupo próprio: o build roda nos runners do GitHub e só toca o droplet no
# passo final (envio do APK), então não disputa recursos com o deploy.
concurrency:
  group: release-android
  cancel-in-progress: false

jobs:
  release-android:
    name: Build, sign and release Android app
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "Tag inválida: $GITHUB_REF_NAME (esperado vMAJOR.MINOR.PATCH)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check Android signing secrets
        id: android_signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build -w frontend

      - name: Set Android version
        run: node scripts/android-set-version.mjs "${{ steps.version.outputs.version }}"

      - name: Prepare Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: node scripts/android-prepare-signing.mjs

      - name: Sync Capacitor Android project
        run: npm run cap:sync:only -w frontend

      - name: Build Android release
        working-directory: frontend/android
        run: |
          chmod +x ./gradlew
          set -o pipefail
          if ! ./gradlew bundleRelease assembleRelease --no-daemon --stacktrace 2>&1 | tee ../../gradle-android-release.log; then
            MESSAGE=$(grep -E 'What went wrong:|Execution failed for task|error:' ../../gradle-android-release.log | head -5 | tr '\n' ' ')
            echo "::error title=Gradle build failed::${MESSAGE:-Ver gradle-android-release.log}"
            exit 1
          fi

      - name: Upload Gradle log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-android-release-log
          path: gradle-android-release.log

      - name: Collect Android artifacts
        run: node scripts/android-collect-artifacts.mjs "${{ steps.version.outputs.version }}"

      # O Gradle só aplica signingConfig quando keystore.properties existe, e sem
      # ele o assembleRelease sai sem assinatura nenhuma — sem erro. Um APK assim
      # não instala no Android 11+, e a v1.1.86 foi publicada assim sem ninguém
      # notar. Aqui a assinatura passa a ser conferida no artefato de verdade.
      - name: Verify APK signature
        env:
          ANDROID_SIGNING_CONFIGURED: ${{ steps.android_signing.outputs.configured }}
          APK: release/referencias-${{ steps.version.outputs.version }}.apk
        run: |
          APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner | sort | tail -1)
          if [ -z "$APKSIGNER" ]; then
            echo "::error title=apksigner ausente::build-tools sem apksigner"
            exit 1
          fi
          if "$APKSIGNER" verify --print-certs "$APK"; then
            echo "APK assinado."
            exit 0
          fi
          if [ "$ANDROID_SIGNING_CONFIGURED" = "true" ]; then
            echo "::error title=APK não assinado::Os secrets ANDROID_KEYSTORE_* estão definidos, mas a assinatura não foi aplicada. Confira alias e senhas."
            exit 1
          fi
          echo "::warning title=APK sem assinatura::Sem os secrets ANDROID_KEYSTORE_*, este APK não instala no Android 11+ e o .aab não é aceito pelo Google Play."

      - name: Generate release notes
        id: notes
        env:
          ANDROID_SIGNING_CONFIGURED: ${{ steps.android_signing.outputs.configured }}
        run: |
          {
            echo 'body<<EOF'
            echo "### App Android"
            echo
            echo "- \`referencias-${{ steps.version.outputs.version }}.aab\` — bundle para Google Play"
            echo "- \`referencias-${{ steps.version.outputs.version }}.apk\` — instalação direta (sideload)"
            echo "- \`/downloads/referencias-latest.apk\` — APK publicado no servidor (após deploy automático)"
            echo
            if [ "$ANDROID_SIGNING_CONFIGURED" = "true" ]; then
              echo "Build assinado com o keystore de release configurado nos secrets do repositório."
            else
              echo "> ⚠️ **Build sem assinatura.** Este APK **não instala** no Android 11 ou superior,"
              echo "> e o \`.aab\` não é aceito pelo Google Play. Configure os secrets"
              echo "> \`ANDROID_KEYSTORE_BASE64\`, \`ANDROID_KEYSTORE_PASSWORD\`, \`ANDROID_KEY_ALIAS\`"
              echo "> e \`ANDROID_KEY_PASSWORD\` para gerar builds instaláveis."
            fi
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Create/update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Referências v${{ steps.version.outputs.version }}
          append_body: true
          body: ${{ steps.notes.outputs.body }}
          files: |
            release/referencias-${{ steps.version.outputs.version }}.aab
            release/referencias-${{ steps.version.outputs.version }}.apk
          generate_release_notes: false
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}

      - name: Publish APK to production server
        if: ${{ vars.DEPLOY_ENABLED == 'true' }}
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PASS: ${{ secrets.DEPLOY_PASSWORD }}
          DEPLOY_VERSION: ${{ steps.version.outputs.version }}
          DEPLOY_APP_DIR: ${{ vars.DEPLOY_APP_DIR }}
          DEPLOY_APP_USER: ${{ vars.DEPLOY_APP_USER }}
          DEPLOY_APK_PATH: release/referencias-${{ steps.version.outputs.version }}.apk
        run: |
          pip install paramiko
          python scripts/deploy/publish-apk-remote.py
