name: Deploy server

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write

# Um grupo só para os deploys de servidor: eles nunca rodam dois ao mesmo tempo
# no droplet. O Android fica em outro grupo de propósito — o GitHub mantém no
# máximo UM run pendente por grupo, então compartilhar o grupo fazia um
# workflow cancelar o outro (foi o que engoliu o deploy da v1.1.64).
concurrency:
  group: deploy-server
  cancel-in-progress: false

jobs:
  deploy-server:
    name: Build, publish packages and deploy server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "Tag inválida: $GITHUB_REF_NAME (esperado vMAJOR.MINOR.PATCH)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@sergiolealedu'

      - name: Align package versions
        run: npm version "${{ steps.version.outputs.version }}" --no-git-tag-version --allow-same-version --workspaces --include-workspace-root

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Sem --provenance: o npm não assina proveniência de repositório privado e
      # o passo abortava, derrubando o deploy antes de chegar ao droplet. O
      # --access acompanha a visibilidade do repo.
      # Antes do backend: ele declara dependência do shared.
      - name: Publish shared to GitHub Packages
        run: npm publish -w shared --access restricted
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish backend to GitHub Packages
        run: npm publish -w backend --access restricted
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish frontend to GitHub Packages
        run: npm publish -w frontend --access restricted
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release bundle
        run: node scripts/package-release.mjs "${{ steps.version.outputs.version }}"

      - name: Create/update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Referências v${{ steps.version.outputs.version }}
          append_body: true
          body: |
            ### Pacotes (GitHub Packages)

            ```
            npm install @sergiolealedu/referencias-backend@${{ steps.version.outputs.version }}
            npm install @sergiolealedu/referencias-frontend@${{ steps.version.outputs.version }}
            ```
          files: |
            release/referencias-${{ steps.version.outputs.version }}.zip
          generate_release_notes: false
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}

      - name: Deploy to production server
        if: ${{ vars.DEPLOY_ENABLED == 'true' }}
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          # Chave tem precedência sobre senha no _ssh.py. Assim que o
          # DEPLOY_SSH_KEY estiver configurado, apague o DEPLOY_PASSWORD.
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KEY_PASSPHRASE: ${{ secrets.DEPLOY_SSH_KEY_PASSPHRASE }}
          DEPLOY_PASS: ${{ secrets.DEPLOY_PASSWORD }}
          DEPLOY_TAG: ${{ github.ref_name }}
          # Para o droplet buscar a tag num repo privado. O token vale só
          # enquanto este run existe, então nada fica guardado na máquina.
          DEPLOY_REPO: ${{ github.repository }}
          DEPLOY_REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_APP_DIR: ${{ vars.DEPLOY_APP_DIR }}
          DEPLOY_PM2_APP: ${{ vars.DEPLOY_PM2_APP }}
          DEPLOY_APP_USER: ${{ vars.DEPLOY_APP_USER }}
        run: |
          pip install paramiko
          python scripts/deploy/publish-server-remote.py
